[project]
name = "aggregator"
version = "0.1.0"
description = "Composable pipelines for aggregating and transforming records."
readme = "README.md"
authors = [
    { name = "Yuvaraj J", email = "jyuvaraj03@gmail.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "celery[redis]>=5.5.0",
    "drain3>=0.9.11",
    "fastapi>=0.128.0",
    "google-auth[requests]>=2.0",
    "langfuse>=4.0.0",
    "langchain>=1.0.0",
    "langchain-mistralai>=1.1.6",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "peewee>=4.4.0",
    "python-dateutil>=2.9.0",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.40.0",
    "iso4217>=1.16.20260101",
    "imap-tools>=1.15.0",
    "pandas>=3.0.5",
    "joblib>=1.6.0",
    "scikit-learn>=1.9.1",
    "typesafe-sdk>=0.7.0",
    "presidio-analyzer==2.2.364",
    "presidio-anonymizer==2.2.364",
    "en-core-web-md @ https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl",
]

[project.scripts]
aggregator = "aggregator.cli:main"
aggregator-api = "aggregator.api.app:main"
aggregator-worker = "aggregator.celery_app:worker_main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
    "httpx2>=0.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
